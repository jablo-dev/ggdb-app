<div class="entry-card-container relative rounded-xl overflow-hidden h-full group cursor-pointer flex" (click)="goToDetail()">
    <!-- Left side: Cover Image (if available) -->
    <div *ngIf="gameRecord?.cover && !imageError" class="cover-image-container flex-shrink-0 relative">
        <img [src]="gameRecord?.cover" class="h-full w-full object-cover" [alt]="gameRecord?.name" (error)="imageError = true">
        <div class="cover-overlay absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
    </div>

    <div class="card-content-wrapper relative flex-grow overflow-hidden flex flex-col">
        <div
            *ngIf="score !== null"
            class="score-badge absolute top-0 right-0 px-3 py-2 font-bold text-lg"
            [ngClass]="{
                'tier-score': display.isTierScore(score),
                'normal-score': !display.isTierScore(score)
            }"
            [attr.data-score-range]="getScoreRange(score)"
            [ngStyle]="display.isTierScore(score) ? {
                'background': display.getTierGradient(score),
                'color': '#000'
            } : {
                'color': 'var(--text-color)'
            }"
        >
            <i
                *ngIf="display.isTierScore(score)"
                class="text-lg mr-1"
                [ngStyle]="{
                    'color': '#000'
                }"
            ></i>
            {{ score }}
        </div>

        <!-- Playtime Badge (moved to bottom right) -->

        <div
            class="title-badge absolute top-0 left-0 px-3 py-2 font-bold text-lg"
            [ngClass]="{
                'no-border': gameRecord?.cover && !imageError,
                'long-title': (gameRecord?.name?.length ?? 0) > 25
            }"
        >
            <span>{{ gameRecord?.name }}</span>
        </div>
        <div class="card-content h-full p-4 relative flex-grow overflow-hidden flex flex-col justify-between">
            <div class="info-grid-section mb-1 grid grid-cols-2 gap-4 min-v-mobile:grid-cols-1 min-v-mobile:gap-1">
                <div class="left-column flex flex-col gap-1">
                    <div class="date-section flex items-center gap-2 text-gray-300">
                        <i class="pi pi-calendar text-base"></i>
                        <span class="text-base truncate">{{ gameRecord?.finishDate | date: 'MMM yyyy' }}</span>
                    </div>

                    <!-- Story completion status -->
                    <div class="completion-section flex items-center gap-2 text-gray-300" *ngIf="gameRecord?.mainQuestDone === 1 && gameRecord?.canceled !== 1">
                        <i class="pi pi-book text-primary"></i>
                        <span class="text-base truncate">Story completed</span>
                    </div>

                    <!-- Canceled status -->
                    <div class="completion-section flex items-center gap-2 text-red-400" *ngIf="gameRecord?.canceled === 1">
                        <i class="pi pi-times-circle text-red-500"></i>
                        <span class="text-base font-semibold truncate">Canceled</span>
                    </div>

                    <!-- Backlog status -->
                    <div class="completion-section flex items-center gap-2 text-orange-400" *ngIf="gameRecord?.backlogItem === 1">
                        <i class="pi pi-bookmark text-orange-500"></i>
                        <span class="text-base font-semibold truncate">Backlog</span>
                    </div>
                </div>

                <!-- Right column -->
                <div class="right-column flex flex-col gap-1">
                    <!-- Platform -->
                    <div class="platform-section flex items-center gap-2 text-gray-300" *ngIf="gameRecord?.location as loc">
                        <i
                            class="platform-icon text-base"
                            [ngClass]="{
                                'bi bi-steam': loc === 'STEAM',
                                'bi bi-playstation': loc === 'PLAYSTATION',
                                'bi bi-xbox': loc === 'XBOX' || loc === 'XBOX_GAME_PASS',
                                'bi bi-nintendo-switch': loc === 'NINTENDO_CONSOLE' || loc === 'NINTENDO_CONSOLE2',
                                'bi bi-disc': loc !== 'STEAM' && loc !== 'PLAYSTATION' && loc !== 'XBOX' && loc !== 'NINTENDO_CONSOLE'
                            }"
                        ></i>
                        <span class="text-base truncate">{{ display.getPlatformLabel(loc) }}</span>
                    </div>

                    <!-- Replay indicator -->
                    <div class="replay-section flex items-center gap-2 text-gray-300" *ngIf="gameRecord?.replay === 1">
                        <i class="pi pi-refresh text-base"></i>
                        <span class="text-base truncate">Replay</span>
                    </div>
                </div>
            </div>

            <!-- Note section -->
            <div class="note-section text-gray-300 overflow-hidden" *ngIf="gameRecord?.note && gameRecord?.note !== 'nan'">
                <div class="flex items-start gap-2 h-full">
                    <i class="pi pi-file-edit text-base mt-1 flex-shrink-0"></i>
                    <p class="text-base leading-relaxed line-clamp-3 md:line-clamp-3 sm:line-clamp-2 min-v-mobile:line-clamp-1">
                        {{ gameRecord?.note }}
                    </p>
                </div>
            </div>

            <!-- Bottom-right corner: {type} {favorite} {playtime} -->
            <div class="absolute bottom-3 right-3 flex items-center gap-2">
                <!-- Type Badge -->
                <span *ngIf="gameRecord?.type && gameRecord?.type !== 'Full Release' && gameRecord?.type !== 'FULL'" class="px-2 py-0.5 rounded bg-primary/10 text-primary border border-primary/20 text-[10px] font-bold uppercase tracking-wider shadow-sm">
                    {{ gameRecord?.type }}
                </span>

                <!-- Favorite Star -->
                <i
                    *ngIf="gameRecord?.fav === 1"
                    class="favorite-star pi pi-star-fill text-yellow-400 text-lg"
                    title="Favorite"
                ></i>

                <!-- Playtime Badge -->
                <div
                    *ngIf="playtimeEnabled && gameRecord?.playtime"
                    class="playtime-badge px-2 py-1 rounded-md font-bold text-sm flex items-center gap-1.5"
                >
                    <i class="pi pi-clock text-xs"></i>
                    <span>{{ (gameRecord?.playtime || 0) / 60 | number:'1.0-1' }}h</span>
                </div>
            </div>
        </div>
    </div>
</div>
