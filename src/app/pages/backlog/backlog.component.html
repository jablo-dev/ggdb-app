<div class="px-4">
    <div class="fixed top-[4.5rem] left-0 right-0 z-10 bg-[var(--surface-ground)] h-20 flex items-center shadow-sm">
        <div class="w-full max-w-none mx-auto px-4">
            <p-toolbar styleClass="mx-auto">
                <ng-template pTemplate="start">
                    <div class="flex items-center gap-2">
                        <p-button icon="pi pi-plus-circle" label="Add" (click)="openAdd()"></p-button>
                    </div>
                </ng-template>
                <ng-template pTemplate="end">
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input type="text" pInputText placeholder="Search backlog..." [(ngModel)]="searchTerm" (input)="onSearch()" class="w-40 sm:w-60 lg:w-80" />
                    </p-iconfield>
                </ng-template>
            </p-toolbar>
        </div>
    </div>

    <div class="pt-32 sm:pt-24 pb-10">
        <div *ngIf="filteredBacklogItems.length === 0" class="flex flex-col items-center justify-center p-10 opacity-50">
            <i class="pi pi-inbox text-5xl mb-4"></i>
            <p class="text-xl">{{ searchTerm ? 'No games matching your search.' : 'Your backlog is empty. Time to add some games!' }}</p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div *ngFor="let item of filteredBacklogItems" class="cursor-pointer transition-transform hover:scale-105" (click)="goToDetail(item)">
                <div class="relative rounded-xl overflow-hidden h-full flex flex-col group">
                    <!-- Image section -->
                    <div class="relative pt-[133%] w-full bg-surface-800">
                        <img *ngIf="item.cover" [src]="item.cover" [alt]="item.name" class="absolute top-0 left-0 w-full h-full object-cover" />
                        <div *ngIf="!item.cover" class="absolute top-0 left-0 w-full h-full flex items-center justify-center opacity-20">
                            <i class="pi pi-image text-4xl"></i>
                        </div>

                        <!-- Platform Badge (Top Left) -->
                        <div class="absolute top-0 left-0 px-2 py-1 font-bold text-[10px] bg-surface-900/90 text-white backdrop-blur-md rounded-br-lg border-b border-r border-white/10 uppercase tracking-wider shadow-md">
                            {{ getPlatformLabel(item.location) }}
                        </div>

                        <!-- Playtime Badge (Bottom Right - mimic playtime badge style) -->
                        <div *ngIf="item.playtime" class="absolute bottom-2 right-2 px-2 py-1 bg-black/60 backdrop-blur-sm rounded-md font-bold text-[10px] flex items-center gap-1.5 border border-white/10">
                            <i class="pi pi-clock text-[8px]"></i>
                            <span>{{ (item.playtime || 0) / 60 | number:'1.0-1' }}h</span>
                        </div>
                    </div>

                    <!-- Title section (below image) -->
                    <div class="pt-3 pb-1">
                        <div class="font-bold text-sm truncate group-hover:text-primary transition-colors" [title]="item.name">
                            {{ item.name }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
