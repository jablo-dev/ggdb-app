<div class="card">
    <div class="flex justify-between items-center mb-6"><div><span class="text-xs uppercase tracking-widest text-primary">Administration</span><h2 class="text-2xl font-bold m-0">Control Logs</h2></div><button mat-stroked-button (click)="loadLogs()"><i aria-hidden="true" class="bi bi-arrow-clockwise"></i> Refresh</button></div>
    <div class="overflow-auto">
        <table mat-table [dataSource]="dataSource" matSort matSortActive="timestamp" matSortDirection="desc" class="w-full">
            <ng-container matColumnDef="timestamp"><th mat-header-cell *matHeaderCellDef mat-sort-header>Timestamp</th><td mat-cell *matCellDef="let log">{{ log.timestamp }}</td></ng-container>
            <ng-container matColumnDef="user"><th mat-header-cell *matHeaderCellDef mat-sort-header>User</th><td mat-cell *matCellDef="let log">{{ log.user }}</td></ng-container>
            <ng-container matColumnDef="action"><th mat-header-cell *matHeaderCellDef mat-sort-header>Action</th><td mat-cell *matCellDef="let log"><span class="px-3 py-1 rounded-full bg-primary/10 text-primary">{{ log.action }}</span></td></ng-container>
            <ng-container matColumnDef="event"><th mat-header-cell *matHeaderCellDef>Event</th><td mat-cell *matCellDef="let log"><div [innerHTML]="formatLogMessage(log)"></div><button *ngIf="log.details" mat-button (click)="showDetails(log.details)">Details</button></td></ng-container>
            <tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row; columns: columns"></tr>
            <tr *matNoDataRow><td colspan="4" class="p-8 text-center">No logs found.</td></tr>
        </table>
    </div>
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[10,25,50]" showFirstLastButtons aria-label="Log pages" />
</div>
<app-dialog header="Action Details" [visible]="!!selectedDetails" (visibleChange)="!$event && (selectedDetails = null)">
    <button mat-stroked-button (click)="copyToClipboard(selectedDetails)"><i aria-hidden="true" class="bi bi-copy"></i> Copy JSON</button>
    <pre class="mt-4 p-4 rounded text-sm overflow-x-auto whitespace-pre-wrap break-all">{{ selectedDetails | json }}</pre>
</app-dialog>
